[package]
name = "termsdr"
version = "0.1.0"
edition = "2021"
description = "Terminal-based SDR application with spectrum and waterfall displays"

[features]
default = []
rtlsdr = ["dep:rtlsdr_rs"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rustfft = "6"
num-complex = "0.4"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
rtlsdr_rs = { package = "rtlsdr", version = "0.1", optional = true }

[dev-dependencies]
approx = "0.5"
