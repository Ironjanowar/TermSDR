[package]
name = "termsdr"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
description = "Terminal-based SDR application with spectrum and waterfall displays"

[features]
default = ["rtlsdr"]
rtlsdr = ["dep:rtlsdr_rs"]
opus = ["dep:opus"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rustfft = "6"
num-complex = "0.4"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
rtlsdr_rs = { package = "rtlsdr", version = "0.1", optional = true }
opus = { version = "0.3", optional = true }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rubato = "=5.1.0"

[dev-dependencies]
approx = "0.5"
proptest = "1"
tokio-tungstenite = "0.26"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"
